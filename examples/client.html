<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChronoStream | Real-Time SSE Explorer</title>
  <style>
    :root {
      --bg-primary: #0a0d14;
      --bg-surface: #111622;
      --bg-surface-elevated: #182030;
      --border-subtle: #232c40;
      --border-focus: #38bdf8;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-cyan-hover: #0ea5e9;
      --status-connected: #10b981;
      --status-connecting: #f59e0b;
      --status-disconnected: #ef4444;
      --code-bg: #06090f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      background: #0284c7;
      color: #fff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-tag {
      font-size: 0.75rem;
      background: var(--bg-surface-elevated);
      color: var(--text-muted);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--status-disconnected);
      transition: background-color 0.2s ease;
    }

    .status-badge[data-status="connected"] .status-dot {
      background-color: var(--status-connected);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }

    .status-badge[data-status="connecting"] .status-dot {
      background-color: var(--status-connecting);
    }

    .status-badge[data-status="disconnected"] .status-dot {
      background-color: var(--status-disconnected);
    }

    main {
      flex: 1;
      padding: 1.5rem;
      max-width: 1300px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    input, textarea, select {
      background-color: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
      transition: border-color 0.15s ease;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--border-focus);
    }

    button {
      background-color: var(--accent-cyan);
      color: #041019;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.65rem 1rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 44px;
      transition: background-color 0.15s ease;
    }

    button:hover {
      background-color: var(--accent-cyan-hover);
    }

    button:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    button.btn-danger {
      background-color: #dc2626;
      color: #ffffff;
    }

    button.btn-danger:hover {
      background-color: #b91c1c;
    }

    button.btn-secondary {
      background-color: var(--bg-surface-elevated);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
    }

    button.btn-secondary:hover {
      background-color: #202b40;
    }

    .preset-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .preset-chip {
      background-color: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .preset-chip:hover {
      border-color: var(--border-focus);
      color: var(--text-main);
    }

    .stream-feed-wrapper {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      height: 100%;
    }

    .feed-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .feed-search {
      flex: 1;
      min-width: 180px;
    }

    .events-list {
      flex: 1;
      min-height: 480px;
      max-height: 680px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding-right: 0.25rem;
    }

    .event-card {
      background-color: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .event-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
    }

    .event-name {
      font-weight: 700;
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.1);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .event-time {
      color: var(--text-muted);
      font-family: monospace;
    }

    .event-body {
      background-color: var(--code-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 0.6rem;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 0.8rem;
      color: #e2e8f0;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1rem;
      text-align: center;
      color: var(--text-muted);
      gap: 0.5rem;
    }

    .empty-state-title {
      font-weight: 600;
      color: var(--text-main);
    }

    .response-feedback {
      font-size: 0.8rem;
      padding: 0.5rem;
      border-radius: 4px;
      display: none;
    }

    .response-feedback.success {
      display: block;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    .response-feedback.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo">CS</div>
      <div>
        <div class="brand-title">ChronoStream</div>
        <div class="brand-tag">Real-Time SSE Broadcasting Engine</div>
      </div>
    </div>
    <div class="status-badge" id="statusBadge" data-status="disconnected">
      <span class="status-dot"></span>
      <span id="statusText">Disconnected</span>
    </div>
  </header>

  <main>
    <!-- Left Column: Controls & Publisher -->
    <div style="display: flex; flex-direction: column; gap: 1.5rem;">
      <!-- Connection Setup -->
      <section class="card" aria-labelledby="connectionHeading">
        <h2 id="connectionHeading" class="card-title">Subscriber Connection</h2>
        
        <div class="form-group">
          <label for="serverUrlInput">Base Server URL</label>
          <input type="text" id="serverUrlInput" value="http://localhost:3000">
        </div>

        <div class="form-group">
          <label for="channelInput">Channel Name</label>
          <input type="text" id="channelInput" value="demo-stream" placeholder="e.g. orders, user-102">
        </div>

        <button type="button" id="toggleConnectBtn">Connect Stream</button>
      </section>

      <!-- Interactive Publisher Console -->
      <section class="card" aria-labelledby="publisherHeading">
        <h2 id="publisherHeading" class="card-title">Test Event Publisher</h2>

        <div class="form-group">
          <label>Quick Presets</label>
          <div class="preset-container">
            <button type="button" class="preset-chip" onclick="loadPreset('order')">Order Placed</button>
            <button type="button" class="preset-chip" onclick="loadPreset('alert')">System Alert</button>
            <button type="button" class="preset-chip" onclick="loadPreset('chat')">Chat Message</button>
          </div>
        </div>

        <div class="form-group">
          <label for="secretKeyInput">Secret Bearer Token</label>
          <input type="password" id="secretKeyInput" value="chronostream_dev_secret_key_change_in_production">
        </div>

        <div class="form-group">
          <label for="eventNameInput">Event Name</label>
          <input type="text" id="eventNameInput" value="order.created">
        </div>

        <div class="form-group">
          <label for="eventDataInput">Payload (JSON or text)</label>
          <textarea id="eventDataInput" rows="4">{\n  "orderId": "ord_98741",\n  "amount": 149.50,\n  "currency": "USD"\n}</textarea>
        </div>

        <button type="button" id="publishBtn">Broadcast via /publish</button>
        <div id="publishFeedback" class="response-feedback"></div>
      </section>
    </div>

    <!-- Right Column: Live Event Stream Feed -->
    <section class="card stream-feed-wrapper" aria-labelledby="feedHeading">
      <div class="card-title">
        <h2 id="feedHeading" style="font-size: 1rem;">Live Event Stream (<span id="eventCount">0</span>)</h2>
        <div style="display: flex; gap: 0.5rem;">
          <button type="button" class="btn-secondary" id="clearBtn" style="min-height: 36px; padding: 0.35rem 0.75rem;">Clear</button>
        </div>
      </div>

      <div class="feed-controls">
        <input type="search" class="feed-search" id="searchFilter" placeholder="Filter events by name or content...">
      </div>

      <div class="events-list" id="eventsList">
        <div class="empty-state" id="emptyState">
          <p class="empty-state-title">No events received yet</p>
          <p>Click "Connect Stream" to establish an SSE connection to ChronoStream.</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    let eventSource = null;
    let registeredEvents = new Set();
    let events = [];

    const serverUrlInput = document.getElementById('serverUrlInput');
    const channelInput = document.getElementById('channelInput');
    const toggleConnectBtn = document.getElementById('toggleConnectBtn');
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const eventsList = document.getElementById('eventsList');
    const emptyState = document.getElementById('emptyState');
    const eventCount = document.getElementById('eventCount');
    const clearBtn = document.getElementById('clearBtn');
    const searchFilter = document.getElementById('searchFilter');

    const secretKeyInput = document.getElementById('secretKeyInput');
    const eventNameInput = document.getElementById('eventNameInput');
    const eventDataInput = document.getElementById('eventDataInput');
    const publishBtn = document.getElementById('publishBtn');
    const publishFeedback = document.getElementById('publishFeedback');

    function setStatus(status, label) {
      statusBadge.setAttribute('data-status', status);
      statusText.textContent = label;
      if (status === 'connected') {
        toggleConnectBtn.textContent = 'Disconnect Stream';
        toggleConnectBtn.classList.add('btn-danger');
      } else {
        toggleConnectBtn.textContent = 'Connect Stream';
        toggleConnectBtn.classList.remove('btn-danger');
      }
    }

    function registerCustomEvent(eventName) {
      if (!eventSource || !eventName) return;
      const trimmed = eventName.trim();
      if (!trimmed || registeredEvents.has(trimmed)) return;
      registeredEvents.add(trimmed);
      eventSource.addEventListener(trimmed, (e) => {
        handleIncomingSSE(trimmed, e);
      });
    }

    function connectSSE() {
      const baseUrl = serverUrlInput.value.trim().replace(/\/$/, '');
      const channel = channelInput.value.trim();

      if (!channel) {
        alert('Please specify a channel name.');
        return;
      }

      const streamUrl = `${baseUrl}/stream?channel=${encodeURIComponent(channel)}`;
      setStatus('connecting', 'Connecting...');

      eventSource = new EventSource(streamUrl);
      registeredEvents = new Set();

      eventSource.onopen = () => {
        setStatus('connected', `Connected: ${channel}`);
      };

      eventSource.onerror = (err) => {
        setStatus('disconnected', 'Disconnected / Retrying');
      };

      // Listen to generic messages and typed events
      eventSource.onmessage = (e) => {
        handleIncomingSSE('message', e);
      };

      eventSource.addEventListener('connected', (e) => {
        handleIncomingSSE('connected', e);
      });

      eventSource.addEventListener('ping', (e) => {
        handleIncomingSSE('ping', e);
      });

      registerCustomEvent('order.created');
      registerCustomEvent('system.alert');
      registerCustomEvent('chat.message');
      if (eventNameInput.value) {
        registerCustomEvent(eventNameInput.value);
      }
    }

    function disconnectSSE() {
      if (eventSource) {
        eventSource.close();
        eventSource = null;
      }
      registeredEvents.clear();
      setStatus('disconnected', 'Disconnected');
    }

    toggleConnectBtn.addEventListener('click', () => {
      if (eventSource) {
        disconnectSSE();
      } else {
        connectSSE();
      }
    });

    function handleIncomingSSE(eventName, eventObj) {
      const eventItem = {
        name: eventName,
        data: eventObj.data,
        id: eventObj.lastEventId || 'none',
        timestamp: new Date().toLocaleTimeString(),
      };

      events.unshift(eventItem);
      renderEvents();
    }

    function renderEvents() {
      const query = searchFilter.value.trim().toLowerCase();
      const filtered = events.filter(e => {
        if (!query) return true;
        return e.name.toLowerCase().includes(query) || e.data.toLowerCase().includes(query);
      });

      eventCount.textContent = events.length;

      if (filtered.length === 0) {
        eventsList.innerHTML = '';
        eventsList.appendChild(emptyState);
        emptyState.style.display = 'flex';
        return;
      }

      emptyState.style.display = 'none';
      eventsList.innerHTML = filtered.map(item => `
        <div class="event-card">
          <div class="event-header">
            <span class="event-name">${escapeHtml(item.name)}</span>
            <span class="event-time">${item.timestamp}</span>
          </div>
          <pre class="event-body">${escapeHtml(formatPayload(item.data))}</pre>
        </div>
      `).join('');
    }

    function formatPayload(str) {
      try {
        const parsed = JSON.parse(str);
        return JSON.stringify(parsed, null, 2);
      } catch {
        return str;
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    clearBtn.addEventListener('click', () => {
      events = [];
      renderEvents();
    });

    searchFilter.addEventListener('input', renderEvents);

    // Event publisher
    publishBtn.addEventListener('click', async () => {
      const baseUrl = serverUrlInput.value.trim().replace(/\/$/, '');
      const channel = channelInput.value.trim();
      const token = secretKeyInput.value.trim();
      const eventName = eventNameInput.value.trim();
      const rawData = eventDataInput.value.trim();

      registerCustomEvent(eventName);

      publishFeedback.className = 'response-feedback';
      publishFeedback.textContent = '';

      let parsedData;
      try {
        parsedData = JSON.parse(rawData);
      } catch {
        parsedData = rawData;
      }

      try {
        const res = await fetch(`${baseUrl}/publish`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`,
          },
          body: JSON.stringify({
            channel,
            event: eventName,
            data: parsedData,
          }),
        });

        const data = await res.json();
        if (res.ok) {
          publishFeedback.className = 'response-feedback success';
          publishFeedback.textContent = `Published successfully! Delivered to ${data.subscribers} subscriber(s).`;
        } else {
          publishFeedback.className = 'response-feedback error';
          publishFeedback.textContent = `Error ${res.status}: ${data.message || data.error}`;
        }
      } catch (err) {
        publishFeedback.className = 'response-feedback error';
        publishFeedback.textContent = `Network error: ${err.message}`;
      }
    });

    function loadPreset(type) {
      if (type === 'order') {
        eventNameInput.value = 'order.created';
        eventDataInput.value = JSON.stringify({
          orderId: `ord_${Math.floor(10000 + Math.random() * 90000)}`,
          amount: (Math.random() * 200 + 20).toFixed(2),
          status: 'paid',
        }, null, 2);
      } else if (type === 'alert') {
        eventNameInput.value = 'system.alert';
        eventDataInput.value = JSON.stringify({
          severity: 'warning',
          service: 'payment-gateway',
          message: 'High latency detected on upstream provider',
        }, null, 2);
      } else if (type === 'chat') {
        eventNameInput.value = 'chat.message';
        eventDataInput.value = JSON.stringify({
          sender: 'Alex',
          text: 'Hello from ChronoStream!',
          timestamp: Date.now(),
        }, null, 2);
      }
    }
  </script>
</body>
</html>
